[project]
name = "supportdesk-mobile"
version = "1.0.0"
description = "Mobile trainer for telecom support engineers"
requires-python = ">=3.12"

[tool.flet]
product = "SupportDesk Mobile"
org = "com.ostenvrn"
build_number = 1

[tool.flet.app]
# Указываем, что код приложения лежит в корне проекта
path = "."
# И что точка входа — это файл app.py
module = "app.py"
