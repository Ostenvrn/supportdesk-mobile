name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install flet-cli
        run: |
          uv tool install --with flet-cli flet
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          flet build apk --module-name app --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: supportdesk-apk
          path: build/apk/*.apk
          if-no-files-found: error
