name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Устанавливаем uv (менеджер пакетов, который использует экшен)
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Запускаем официальный экшен БЕЗ ручной установки flet-cli
      - name: Build APK with Flet
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supportdesk-apk
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
