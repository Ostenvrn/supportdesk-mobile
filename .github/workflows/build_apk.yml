name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK with Flet
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          # Точка входа — наш app.py
          # В action это передается через pyproject.toml, но можно указать явно
          # (по умолчанию action ищет main.py, поэтому это важно)
          # Примечание: flet-build-action берет настройки из pyproject.toml,
          # поэтому убедись, что там указан правильный модуль, если нужно.
          # В нашем случае, так как точка входа app.py, 
          # лучше указать это в pyproject.toml через module_name, если action не найдет.
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supportdesk-apk
          path: build/apk/*.apk
          if-no-files-found: error
